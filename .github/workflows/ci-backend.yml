name: CI Backend

# Compila y ejecuta los tests del backend (Spring Boot / Maven).
# Los tests de integracion usan Testcontainers, que aprovecha el Docker
# ya disponible en los runners ubuntu-latest.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-test:
    name: Build y test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress verify
