name: CI Backend

# Compila y ejecuta los tests del backend (Spring Boot / Maven).
# Los tests de integracion usan Testcontainers, que aprovecha el Docker
# ya disponible en los runners ubuntu-latest.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-test:
    name: Build y test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress verify

      - name: Resumen de cobertura (JaCoCo)
        # Instrucciones y ramas del codigo de src/main ejecutado por las pruebas (unitarias + integracion).
        run: |
          awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {printf "Cobertura de instrucciones: %.1f %% (%d de %d)\n", 100*ic/(im+ic), ic, im+ic; printf "Cobertura de ramas: %.1f %% (%d de %d)\n", 100*bc/(bm+bc), bc, bm+bc}' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
