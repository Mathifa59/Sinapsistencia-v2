spring:
  application:
    name: sinapsistencia

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sinapsistencia}
    username: ${DB_USER:sinapsistencia}
    password: ${DB_PASSWORD:sinapsistencia}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Auto-arranca el Postgres de docker-compose.yml (raíz del monorepo) al correr la app en dev.
  # En producción (Railway) establece SPRING_DOCKER_COMPOSE_ENABLED=false como env var.
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ../docker-compose.yml
      lifecycle-management: start-only

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Configuracion propia de la aplicacion (consumida en fases posteriores).
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-use-a-long-random-base64-secret-value-please}
    expiration: ${JWT_EXPIRATION:86400000} # 24h en ms
    cookie-secure: ${JWT_COOKIE_SECURE:false} # true en prod (HTTPS)
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
  n8n:
    # Vacio por defecto: sin n8n configurado no se intenta ninguna conexion
    # (alertas de riesgo y correos se omiten con log.warn). Setea la URL en prod
    # o en local si corres n8n (ej. http://localhost:5678).
    webhook-url: ${N8N_WEBHOOK_URL:}
  # URL publica del frontend (Vercel en prod) — usada para armar los enlaces de los correos.
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}
  cloudinary:
    url: ${CLOUDINARY_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Correos de las cuentas demo (Dr. Carlos / Dra. Lucia). Por defecto los del
  # seed; en prod se sobreescriben con correos reales para demostrar el envio.
  demo:
    doctor-email: ${DEMO_DOCTOR_EMAIL:doctor.demo@sinapsistencia.pe}
    lawyer-email: ${DEMO_LAWYER_EMAIL:lawyer.demo@sinapsistencia.pe}
