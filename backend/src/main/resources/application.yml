spring:
  application:
    name: sinapsistencia

  autoconfigure:
    # La app autentica solo con JWT (SecurityConfig desactiva httpBasic y formLogin):
    # no necesita el usuario en memoria con contraseña generada que Spring Security
    # crea por defecto y que imprimía "Using generated security password" en el log.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sinapsistencia}
    username: ${DB_USER:sinapsistencia}
    password: ${DB_PASSWORD:sinapsistencia}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Auto-arranca el Postgres de docker-compose.yml (raíz del monorepo) al correr la app en dev.
  # En producción (Railway) establece SPRING_DOCKER_COMPOSE_ENABLED=false como env var.
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ../docker-compose.yml
      lifecycle-management: start-only

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Configuracion propia de la aplicacion (consumida en fases posteriores).
app:
  auth:
    # Imprime en el log del servidor el token de recuperacion cuando no hay Resend.
    # Solo se activa en application-local.yml; nunca viaja en la respuesta HTTP.
    log-reset-token: false
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-use-a-long-random-base64-secret-value-please}
    expiration: ${JWT_EXPIRATION:86400000} # 24h en ms
    cookie-secure: ${JWT_COOKIE_SECURE:false} # true en prod (HTTPS)
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
  resend:
    # Obligatoria salvo en los perfiles local y test: ResendStartupValidator impide
    # arrancar sin ella. En local (SPRING_PROFILES_ACTIVE=local) puede quedar vacia.
    api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:notificaciones@sinapsistencia.com}
    # A donde llegan las respuestas de los usuarios (no confundir con `from`, que solo
    # necesita vivir en un dominio verificado en Resend, no ser una bandeja real).
    # Vacio = sin header Reply-To.
    reply-to: ${MAIL_REPLY_TO:}
    # Destinatario de la alerta de riesgo alto/critico (HU-31). Vacio = se omite.
    risk-alert-to: ${RISK_ALERT_EMAIL:}
  # H-06: NotificationWorker despacha el outbox de notificaciones en lotes
  # periodicos. worker-enabled en false detiene el despacho (las filas siguen
  # encolandose, solo no se procesan) -- util para pruebas o mantenimiento.
  notifications:
    worker-enabled: ${NOTIFICATIONS_WORKER_ENABLED:true}
    worker-interval-ms: ${NOTIFICATIONS_WORKER_INTERVAL_MS:15000}
  # URL publica del frontend (Vercel en prod) — usada para armar los enlaces de los correos.
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}
  cloudinary:
    url: ${CLOUDINARY_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Correos de las cuentas demo (Dr. Carlos / Dra. Lucia). Por defecto los del
  # seed; en prod se sobreescriben con correos reales para demostrar el envio.
  demo:
    doctor-email: ${DEMO_DOCTOR_EMAIL:doctor.demo@sinapsistencia.pe}
    lawyer-email: ${DEMO_LAWYER_EMAIL:lawyer.demo@sinapsistencia.pe}
    # Si se define, el resto de abogados demo pasan a alias base+usuario@dominio.
    mail-base: ${DEMO_MAIL_BASE:}
